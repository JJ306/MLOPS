name: CI

on:
  push:
    branches: [ main, feature/predictive_maintenance ]
  
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./predictive-maintenance/requirements_docker.txt
          pip install flake8

      - name: Run flake8
        run: |
          flake8 ./predictive-maintenance/src ./predictive-maintenance/tests
  
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./predictive-maintenance/requirements_docker.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest -q
  
  build-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./predictive-maintenance
          file: ./predictive-maintenance/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-api:${{ github.sha }}
